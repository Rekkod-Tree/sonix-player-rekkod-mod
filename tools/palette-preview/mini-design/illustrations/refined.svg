я.</text><text x="40" y="661" font-size="18" fill="#1c2a34" font-family="Segoe UI Semibold,Arial,sans-serif" font-weight="600" >Кнопки 64 / 44</text><text x="40" y="689" font-size="14" fill="#536773" font-family="Segoe UI,Arial,sans-serif" font-weight="400" >Зоны 88 × 112 / 64 × 64.</text><text x="40" y="712" font-size="14" fill="#536773" font-family="Segoe UI,Arial,sans-serif" font-weight="400" >Штатные значки.</text><text x="568" y="661" font-size="18" fill="#1c2a34" font-family="Segoe UI Semibold,Arial,sans-serif" font-weight="600" >Прогресс 3 px</text><text x="568" y="689" font-size="14" fill="#536773" font-family="Segoe UI,Arial,sans-serif" font-weight="400" >В компактном — до кнопки.</text><text x="568" y="712" font-size="14" fill="#536773" font-family="Segoe UI,Arial,sans-serif" font-weight="400" >Без лишней цветной черты.</text><text x="40" y="817" font-size="14" fill="#536773" font-family="Segoe UI,Arial,sans-serif" font-weight="400" >Эскизы. Карточка, резерв, жесты и действия сохраняются; прошивка не изменена.</text></svg>